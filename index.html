<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holo Cards</title>
  <!-- installable: full screen from the home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Holo Cards">
  <meta name="theme-color" content="#0c0c10">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="card" id="card">
      <div class="face">
        <img class="art" id="art" alt="">
        <div class="holo"></div>
        <canvas class="sparkles" id="sparkles"></canvas>
        <div class="glare"></div>
        <div class="stripes"></div>
      </div>
      <div class="pop" id="pop"></div>
    </div>
  </main>

  <nav class="controls">
    <button id="prev" aria-label="Previous card">◀</button>
    <span id="dots" class="dots"></span>
    <button id="next" aria-label="Next card">▶</button>
    <button id="add">+ Add card</button>
    <button id="remove" hidden>Remove</button>
  </nav>

  <!-- add-a-card flow (editor.js) -->
  <section class="editor" id="editor" hidden>
    <div class="step" id="stepPick">
      <h2>Add a card</h2>
      <label class="pick">
        <span>1. The card, with the character removed</span>
        <input type="file" id="fileArt" accept="image/*">
      </label>
      <label class="pick">
        <span>2. The character on its own</span>
        <input type="file" id="fileChar" accept="image/*">
      </label>
      <label class="pick">
        <span>Name (optional)</span>
        <input type="text" id="cardName" placeholder="e.g. Crystal Charizard">
      </label>
      <p class="status" id="pickStatus"></p>
      <div class="row">
        <button id="cancelPick">Cancel</button>
        <button id="nextPick" class="primary" disabled>Next</button>
      </div>
    </div>

    <div class="step" id="stepPlace" hidden>
      <p class="hint">Drag the character into place. Drag the dashed line to where it should fade into the card.</p>
      <div class="place" id="place">
        <img id="placeArt" alt="">
        <img id="placeChar" alt="">
        <div class="fadeLine" id="fadeLine"><span>fade line</span></div>
      </div>
      <label class="size">Size <input type="range" id="charSize" min="20" max="160" value="94"></label>
      <div class="row">
        <button id="backPlace">Back</button>
        <button id="savePlace" class="primary">Save card</button>
      </div>
    </div>
  </section>

  <script src="cards.js"></script>
  <script src="process.js"></script>
  <script src="app.js"></script>
  <script src="editor.js"></script>
</body>
</html>
