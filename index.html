<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holo Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage"></main>

  <nav class="controls" id="controls">
    <button id="prev" aria-label="Previous card">◀</button>
    <span id="dots" class="dots"></span>
    <button id="next" aria-label="Next card">▶</button>
  </nav>
  <button id="motion" class="motion" hidden>Tilt with phone</button>

  <script src="cards.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
