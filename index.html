<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holo Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="card" id="card">
      <div class="face">
        <img class="art" id="art" alt="">
        <div class="holo"></div>
        <canvas class="sparkles" id="sparkles"></canvas>
        <div class="glare"></div>
        <div class="stripes"></div>
      </div>
      <div class="pop" id="pop"><div class="float"><img class="ghost g1" alt=""><img class="ghost g2" alt=""><img id="popImg" alt=""><div class="stripes"></div></div></div>
    </div>
  </main>

  <nav class="controls">
    <button id="prev" aria-label="Previous card">◀</button>
    <span id="dots" class="dots"></span>
    <button id="next" aria-label="Next card">▶</button>
  </nav>
  <button id="motion" class="motion" hidden>Tilt with phone</button>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
