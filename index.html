<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holo Cards</title>
  <!-- installable: full screen from the home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Holo Cards">
  <meta name="theme-color" content="#0c0c10">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="card" id="card">
      <div class="face">
        <img class="art" id="art" alt="">
        <div class="holo"></div>
        <canvas class="sparkles" id="sparkles"></canvas>
        <div class="glare"></div>
        <div class="stripes"></div>
      </div>
      <div class="pop" id="pop"></div>
    </div>
  </main>

  <nav class="controls">
    <button id="prev" aria-label="Previous card">◀</button>
    <span id="dots" class="dots"></span>
    <button id="next" aria-label="Next card">▶</button>
    <button id="add">+ Add card</button>
    <button id="remove" hidden>Remove</button>
  </nav>

  <!-- add-a-card flow (editor.js): "+ Add card" opens the photo picker straight away -->
  <input type="file" id="fileCard" accept="image/*" hidden>
  <section class="editor" id="editor" hidden>
    <div class="step" id="stepKey" hidden>
      <h2>Connect Gemini (one time)</h2>
      <p class="status big">To cut characters out of plain card photos, this app uses Google Gemini. Get a free API key, then paste it here. It stays on this phone only.</p>
      <a class="big link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">1. Get a key at aistudio.google.com/apikey</a>
      <input type="password" id="keyInput" placeholder="2. Paste your Gemini API key" autocomplete="off">
      <p class="status" id="keyMsg"></p>
      <button class="big primary" id="keySave">Save key and continue</button>
      <button class="big" id="keyCancel">Cancel</button>
    </div>
    <div class="step" id="stepWork">
      <div class="spinner" id="spinner"></div>
      <p class="status big" id="pickStatus"></p>
      <button class="big primary" id="retryPick" hidden>Choose another photo</button>
      <button class="big" id="cancelPick">Cancel</button>
    </div>

    <div class="step" id="stepPlace" hidden>
      <div class="place" id="place">
        <img id="placeArt" alt="">
        <div class="win" id="win">
          <i data-edge="t"></i><i data-edge="b"></i><i data-edge="l"></i><i data-edge="r"></i>
        </div>
        <img id="placeChar" alt="">
      </div>
      <p class="hint">Drag the character to move it. Drag the dashed box edges to fit the art window.</p>
      <label class="size">Size <input type="range" id="charSize" min="20" max="160" value="94"></label>
      <button class="big toggle" id="holoToggle" aria-pressed="true">✨ Holo glitter: On</button>
      <input type="text" id="cardName" placeholder="Card name (optional)">
      <button class="big primary" id="savePlace">Save card</button>
      <button class="big" id="backPlace">Cancel</button>
    </div>
  </section>

  <script src="cards.js"></script>
  <script src="process.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="editor.js"></script>
</body>
</html>
